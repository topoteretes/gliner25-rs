[workspace]
resolver = "3"
members = [
    # One crate. The engine and the schema families ship together because
    # anyone using this model wants both; splitting them produced a package
    # that was only ever installed as a set.
    "crates/gliner25-rs",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
authors = ["Dario Finardi <df@dariofinardi.it>"]
license = "Apache-2.0"
repository = "https://github.com/dariofinardi/gliner25-rs"
homepage = "https://edito-pdf.com"

[workspace.dependencies]
# One ort version for the whole workspace: mixing release candidates across
# crates would link two incompatible ONNX Runtime bindings into one binary.
#
# Caret, not `=`. An exact pin is right for an application and wrong for a
# published library: it would stop anyone combining these crates with another
# that also depends on ort, and there is no way for them to resolve it. `^` here
# means >=2.0.0-rc.13 and <3.0.0, later release candidates included.
#
# The floor is rc.13 for a concrete reason, not caution. Release candidates 10
# through 12 were tried in this project and rejected: on ARM CPU some models
# hung during session initialisation or inference, reproducibly enough that the
# project stayed on rc.9 for months rather than move to them. rc.13 is the first
# candidate since rc.9 that runs those models on ARM, which is why the migration
# skipped three releases. Do not lower this floor.
#
# Upwards the caret is a calculated risk. Between rc.9 and rc.13, `commit()`
# changed its return type, `Session::run` began taking `&mut self`,
# `try_extract_tensor` started returning a `Shape`, and `Outlet`'s fields went
# private. A future rc can break the build the same way. Pin exactly in your own
# application if you need the guarantee; a library should not impose it.
#
# COGNEE FORK DELTA. Upstream's list was:
#
#     features = ["std", "ndarray", "load-dynamic",
#                 "cuda", "rocm", "coreml", "openvino", "directml",
#                 "tensorrt", "xnnpack", "qnn", "half"]
#
# Only `std`, `ndarray` and `half` stay unconditional. `load-dynamic` and the
# eight execution-provider features moved behind `gliner25-rs`'s own cargo
# features, all off by default — see `[features]` in
# `crates/gliner25-rs/Cargo.toml`, and FORK.md for the full rationale.
#
# The reason is Cargo feature unification. `ort/load-dynamic` pulls
# `ort-sys/disable-linking`, and features are additive across a whole build
# graph: a binary that links this crate *and* another `ort` consumer that
# expects a downloaded or system-linked ONNX Runtime ends up with neither. In
# cognee that consumer is `cognee-embedding`'s `onnx` backend, whose
# `ort::init().commit()` sits behind an `.expect(...)`, so it would panic at
# startup in every wheel, Node addon, C staticlib and CLI that ships it.
# Enabling the feature stays a one-flag decision for a caller that genuinely
# wants to load a dylib at run time.
#
# `download-binaries` + `tls-rustls` replace what `load-dynamic` used to
# provide. Upstream never needed them: `load-dynamic` implies
# `ort-sys/disable-linking`, so `OrtGetApiBase` was resolved from a dylib at
# run time and nothing had to be linked. Drop `load-dynamic` with nothing in
# its place and every binary fails to link with `undefined symbol:
# OrtGetApiBase`. `download-binaries` is also the mode `cognee-embedding`'s
# `onnx` backend already builds in, so this is the link mode the two agree on
# by default. `tls-rustls`, not ort's default `tls-native`, for the same
# reason the `hf-hub` entry below picks `ureq`: no `openssl`.
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std", "ndarray", "half", "download-binaries", "tls-rustls",
] }
ndarray = "0.17"

# Hub client for the `hub` feature. `default-features = false` with `ureq` alone
# keeps TLS on `rustls`: hf-hub's default set pulls `native-tls` and with it
# `openssl` — a C library and its CVE stream — for no gain here.
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq"] }
tokenizers = "0.23"
anyhow = "1.0"
half = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
